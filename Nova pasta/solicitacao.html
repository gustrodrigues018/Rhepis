<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solicitação</title>

<link rel="stylesheet" href="css/main.css">
</head>

<body>

<div class="page-container app">

  <div class="card form-card">

    <h2 class="titulo-principal">Nova Solicitação</h2>

    <form class="form-padrao" onsubmit="event.preventDefault(); enviarPedido();">

      <select id="item" class="input-padrao">
        <option value="">Selecione o item</option>
        <option>Bota</option>
        <option>Calça preta</option>
        <option>Calça supply</option>
        <option>Camiseta Eficiência</option>
        <option>Camiseta Leroy</option>
        <option>Colete</option>
        <option>Jaqueta supply</option>
        <option>Jaqueta Leroy</option>
        <option>Camiseta Aprendiz</option>
        <option>Camiseta supply</option>
        <option>Capacete</option>
        <option>Estilete</option>
        <option>Luva</option>
      </select>

      <select id="tamanho" class="input-padrao">
        <option>Selecione o item primeiro</option>
      </select>

      <input 
        type="number" 
        id="quantidade" 
        class="input-padrao"
        min="1"
        value="1"
      >

      <button type="submit" class="btn btn-principal">
        Enviar
      </button>

    </form>

    <div class="link">
      <a href="usuario.html">Meus pedidos</a>
    </div>

  </div>

</div>

<script type="module" src="js/script.js"></script>
</body>
</html>
